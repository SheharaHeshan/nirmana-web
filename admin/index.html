<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin | Nirmana Constructions</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: var(--color-light); }
        .admin-nav { background-color: var(--color-dark); padding: 15px 0; color: white; }
        .admin-nav .container { display: flex; justify-content: space-between; align-items: center; }
        .admin-nav a { font-weight: bold; }
        
        .admin-container { max-width: 1000px; margin: 50px auto; padding: 0 5%; }
        
        .panel { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .panel h2 { margin-bottom: 20px; font-size: 1.5rem; color: var(--color-dark); border-bottom: 2px solid var(--color-primary); padding-bottom: 10px; display: inline-block; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--color-dark); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: var(--font-body);
            color: var(--color-dark); background-color: #fff;
        }
        
        .project-list-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .project-list-table th, .project-list-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        .project-list-table th { background: var(--color-dark); color: white; }
        
        .action-btn { padding: 5px 10px; border: none; cursor: pointer; border-radius: 4px; color: white; font-size: 0.9rem; margin-right: 5px;}
        .edit-btn { background-color: #f39c12; }
        .delete-btn { background-color: var(--color-primary); }

        .project-list-table-wrapper { overflow-x: auto; }
        .project-list-table { width: 100%; border-collapse: collapse; margin-top: 20px; min-width: 600px; }
        
        #login-section { max-width: 400px; margin: 100px auto; padding: 0 5%; }
        #admin-section { display: none; }
        
        @media (max-width: 768px) {
            .flex-row { flex-direction: column !important; gap: 0 !important; }
        }
    </style>
</head>
<body>

    <div class="admin-nav">
        <div class="container">
            <div class="logo"><span class="text-red">ADMIN</span> <span class="text-white">PANEL</span></div>
            <div>
                <a href="index.html" class="text-white" style="margin-right: 15px;"><i class="fas fa-home"></i> Back to Site</a>
                <a href="#" class="text-white" id="logout-btn" style="display: none;" onclick="logoutAdmin(event)"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>
    </div>

    <div id="login-section">
        <div class="panel">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
            </form>
        </div>
    </div>

    <div class="admin-container" id="admin-section">
        <div class="panel">
            <h2 id="form-title">Add New Project</h2>
            <form id="project-form">
                <input type="hidden" id="project-id">
                <div class="form-group">
                    <label>Project Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="flex-row" style="display: flex; gap: 20px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Sector Type (e.g. Residential, Commercial)</label>
                        <input type="text" id="type" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Finish Type (e.g. Titanium Finish)</label>
                        <input type="text" id="finish" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="desc" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Images (Select one or more images from your device)</label>
                    <input type="file" id="images-file" accept="image/*" multiple>
                    <small id="image-status" style="color: #666; display: block; margin-top: 5px;"></small>
                </div>
                <button type="submit" class="btn btn-primary" id="save-btn">Save Project</button>
                <button type="button" class="btn btn-outline" style="background:#666;" onclick="resetForm()">Clear Form</button>
            </form>
        </div>

        <div class="panel">
            <h2>Current Projects</h2>
            <div class="project-list-table-wrapper">
                <table class="project-list-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Type</th>
                            <th>Finish</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-project-list">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let currentUploadedImages = [];

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('login-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const u = document.getElementById('username').value;
                const p = document.getElementById('password').value;
                if(u === 'admin' && p === '1234') {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('admin-section').style.display = 'block';
                    document.getElementById('logout-btn').style.display = 'inline-block';
                    renderAdminTable();
                } else {
                    alert('Invalid credentials');
                }
            });

            document.getElementById('images-file').addEventListener('change', function(e) {
                const files = e.target.files;
                if(files.length > 0) {
                    currentUploadedImages = [];
                    let loaded = 0;
                    document.getElementById('image-status').innerText = 'Loading images...';
                    for(let i = 0; i < files.length; i++) {
                        const reader = new FileReader();
                        reader.onload = function(evt) {
                            currentUploadedImages.push(evt.target.result);
                            loaded++;
                            if(loaded === files.length) {
                                document.getElementById('image-status').innerText = loaded + ' image(s) ready to save.';
                            }
                        };
                        reader.readAsDataURL(files[i]);
                    }
                }
            });

            document.getElementById('project-form').addEventListener('submit', function(e) {
                e.preventDefault();
                saveAdminProject();
            });
        });

        function renderAdminTable() {
            const projects = getProjects();
            const tbody = document.getElementById('admin-project-list');
            let html = '';
            projects.forEach(p => {
                html += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.title}</td>
                        <td>${p.type}</td>
                        <td>${p.finish}</td>
                        <td>
                            <button class="action-btn edit-btn" onclick="editProject(${p.id})">Edit</button>
                            <button class="action-btn delete-btn" onclick="deleteProject(${p.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function saveAdminProject() {
            const idVal = document.getElementById('project-id').value;
            const title = document.getElementById('title').value;
            const type = document.getElementById('type').value;
            const finish = document.getElementById('finish').value;
            const desc = document.getElementById('desc').value;
            
            let projects = getProjects();
            let imagesToSave = currentUploadedImages;
            
            if (idVal) {
                // Update
                const index = projects.findIndex(p => p.id === parseInt(idVal));
                if (index > -1) {
                    // if no new images were uploaded, keep the old ones
                    if (imagesToSave.length === 0) {
                        imagesToSave = projects[index].images;
                    }
                    projects[index] = { id: parseInt(idVal), title, type, finish, desc, images: imagesToSave };
                }
            } else {
                // Create
                const newId = projects.length > 0 ? Math.max(...projects.map(p => p.id)) + 1 : 1;
                projects.push({ id: newId, title, type, finish, desc, images: imagesToSave });
            }

            saveProjects(projects);
            resetForm();
            renderAdminTable();
            alert("Project saved successfully.");
        }

        function editProject(id) {
            const project = getProjectById(id);
            if (!project) return;
            
            document.getElementById('form-title').innerText = "Edit Project";
            document.getElementById('project-id').value = project.id;
            document.getElementById('title').value = project.title;
            document.getElementById('type').value = project.type;
            document.getElementById('finish').value = project.finish;
            document.getElementById('desc').value = project.desc || "";
            document.getElementById('images-file').value = "";
            currentUploadedImages = [];
            document.getElementById('image-status').innerText = (project.images && project.images.length > 0) ? project.images.length + " previous image(s) kept. Upload new to replace." : "";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProject(id) {
            if(confirm("Are you sure you want to delete this project?")) {
                let projects = getProjects();
                projects = projects.filter(p => p.id !== id);
                saveProjects(projects);
                renderAdminTable();
            }
        }

        function logoutAdmin(e) {
            e.preventDefault();
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
            document.getElementById('login-form').reset();
        }

        function resetForm() {
            document.getElementById('project-form').reset();
            document.getElementById('project-id').value = '';
            document.getElementById('form-title').innerText = "Add New Project";
            document.getElementById('image-status').innerText = "";
            currentUploadedImages = [];
        }
    </script>
</body>
</html>
